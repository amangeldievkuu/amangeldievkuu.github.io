<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%SITE_NAME% — %SITE_TAGLINE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta property="og:title" content="%SITE_NAME% — %SITE_TAGLINE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Inter:opsz,wght@14..32,400..600&display=swap" />
    <script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip" href="#about">Skip to content</a>
    <header class="top">
      <a class="mark" href="/" aria-label="%SITE_NAME%, home">%SITE_NAME%<span>.</span></a>
      <nav aria-label="Sections">
        <a href="#writing">writing</a>
        <a href="#projects">projects</a>
        <a href="#photos">photos</a>
        <a href="#github">github</a>
        <a href="#elsewhere">elsewhere</a>
      </nav>
    </header>

    <main><!--site:main--></main>

    <div class="ink" aria-hidden="true">
      <svg class="ink-svg"><path class="ink-line" /><circle class="ink-end" r="3.5" /></svg>
      <div class="walker">
        <button class="walker-body" type="button" tabindex="-1" aria-hidden="true">
          <svg viewBox="0 0 30 30">
            <g class="walker-legs"><path class="leg leg-a" d="M12 22 11 29" /><path class="leg leg-b" d="M18 22 19 29" /></g>
            <g class="walker-blob">
              <path class="walker-hair" d="M15 6c-1-3 1-5 3-5" />
              <path class="walker-fill" d="M15 5.5c5.6 0 9 3.6 9 8.4 0 5-3.6 8.6-9 8.6s-9-3.4-9-8.4c0-5 3.6-8.6 9-8.6Z" />
              <g class="walker-eyes"><circle cx="17.5" cy="12.5" r="1.3" /><circle cx="21.5" cy="12.5" r="1.3" /></g>
            </g>
          </svg>
        </button>
        <p class="walker-says"></p>
      </div>
    </div>

    <div class="pot" inert>
      <button class="pot-button" type="button" aria-label="Your plant">
        <svg class="pot-art" viewBox="0 0 48 72" aria-hidden="true">
          <g class="pot-plant" style="transform-origin: 24px 50px">
            <g class="pot-sway" style="transform-origin: 24px 50px">
              <path class="pot-stem" pathLength="1" d="M24 50c-2-8 2-14 0-21s-2-14 0-21" />
              <g class="pot-leaf" style="transform-origin: 24px 47px"><path class="pot-blade" d="M24 47q4.7-5.7 10.4-3.6q-4.7 4.2-10.4 3.6Z" /></g>
              <g class="pot-leaf" style="transform-origin: 24px 41.5px"><path class="pot-blade" d="M24 41.5q-4.4-5.4-9.8-3.4q4.4 3.9 9.8 3.4Z" /></g>
              <g class="pot-leaf" style="transform-origin: 24px 36px"><path class="pot-blade" d="M24 36q4.2-5.1 9.3-3.2q-4.2 3.7-9.3 3.2Z" /></g>
              <g class="pot-leaf" style="transform-origin: 24px 30.5px"><path class="pot-blade" d="M24 30.5q-3.9-4.8-8.7-3q3.9 3.5 8.7 3Z" /></g>
              <g class="pot-leaf" style="transform-origin: 24px 25px"><path class="pot-blade" d="M24 25q3.7-4.5 8.1-2.8q-3.7 3.3-8.1 2.8Z" /></g>
              <g class="pot-leaf" style="transform-origin: 24px 19.5px"><path class="pot-blade" d="M24 19.5q-3.4-4.2-7.6-2.6q3.4 3 7.6 2.6Z" /></g>
              <g class="pot-leaf" style="transform-origin: 24px 14px"><path class="pot-blade" d="M24 14q3.1-3.8 7-2.4q-3.1 2.8-7 2.4Z" /></g>
              <path class="pot-bud" d="M24 9c-2.2-1.6-2.4-4.8 0-7 2.4 2.2 2.2 5.4 0 7Z" />
              <g class="pot-bloom" style="transform-origin: 24px 7px"><path class="pot-petals" /><circle class="pot-heart" cx="24" cy="7" r="1.7" /></g>
              <g class="pot-butterfly" transform="translate(37 1)">
                <g class="pot-flutter"><path class="pot-wings" d="M0 0C-2-3.5-5.5-3-5-.5S-1.5 2 0 0ZM0 0C2-3.5 5.5-3 5-.5S1.5 2 0 0Z" /></g>
              </g>
            </g>
          </g>
          <path class="pot-sprout" style="transform-origin: 15.5px 50px" d="M15.5 50q-.4-3.6-3.4-5.6" />
          <path class="pot-sprout" style="transform-origin: 32.5px 50px" d="M32.5 50q.4-3.6 3.4-5.6" />
          <path class="pot-sprout" style="transform-origin: 19px 50px" d="M19 50q-.2-3-1.8-4.6" />
          <path class="pot-sprout" style="transform-origin: 29px 50px" d="M29 50q.2-3 1.8-4.6" />
          <path class="pot-sprout" style="transform-origin: 12px 50px" d="M12 50q-.6-2.6-2.8-3.8" />
          <path class="pot-clay" d="M7 50h34v5H7ZM10 55l3.5 15h21L38 55" />
          <path class="pot-snow" d="M6.2 51.2c-.4-2 1.4-3.1 3.2-2.4.8-1.6 3.4-1.8 4.6-.4 1-1.4 3.6-1.5 4.8-.2 1.2-1.3 3.8-1.3 5 0 1.2-1.3 3.8-1.3 5 0 1.2-1.4 3.8-1.3 4.8.2 1.2-1.4 3.8-1.2 4.6.4 1.8-.7 3.6.4 3.2 2.4Z" />
          <g class="pot-flakes"><circle cx="4" cy="0" r="1" /><circle cx="17" cy="0" r=".8" /><circle cx="33" cy="0" r="1" /><circle cx="45" cy="0" r=".8" /></g>
          <g class="pot-fallen" style="transform-origin: 24px 32px"><path class="pot-blade" d="M24 32q4-4.8 8.8-3.1q-4 3.5-8.8 3.1Z" /></g>
          <g class="pot-can" style="transform-origin: 2px 19px"><path d="M-7 14h12l-1 10H-6ZM4.6 20l7.4-6.5M11 12.4l2.2 2.2M-7 16.5c-3 0-3 5 0 5M-4.5 14c0-3 7-3 7 0" /></g>
          <g class="pot-drops"><path transform="translate(13.6 22)" d="M0 0c-.9 1.3-1.2 2-1.2 2.6a1.2 1.2 0 0 0 2.4 0C1.2 2 .9 1.3 0 0Z" /><path transform="translate(15.2 21)" d="M0 0c-.9 1.3-1.2 2-1.2 2.6a1.2 1.2 0 0 0 2.4 0C1.2 2 .9 1.3 0 0Z" /><path transform="translate(14.2 23)" d="M0 0c-.9 1.3-1.2 2-1.2 2.6a1.2 1.2 0 0 0 2.4 0C1.2 2 .9 1.3 0 0Z" /></g>
        </svg>
        <span class="pot-count" aria-hidden="true"><span></span></span>
      </button>
    </div>

    <!--site:viewer-->

    <dialog class="keepsake" data-keepsake data-site="%SITE_NAME%" aria-labelledby="keepsake-name" aria-describedby="keepsake-about">
      <div class="keepsake-card">
        <svg class="keepsake-art" viewBox="0 0 240 220" aria-hidden="true">
          <path class="keepsake-cup" />
          <circle class="keepsake-heart" r="0" />
          <path class="keepsake-line" pathLength="1" />
        </svg>
        <h2 class="keepsake-name" id="keepsake-name"></h2>
        <p class="keepsake-about" id="keepsake-about"></p>
        <p class="keepsake-meta"></p>
        <form method="dialog"><button class="keepsake-close" aria-label="Close">&times;</button></form>
      </div>
      <div class="keepsake-actions">
        <button type="button" data-keep>keep it</button>
        <button type="button" data-give>give it to someone</button>
      </div>
      <p class="keepsake-note" role="status"></p>
    </dialog>
  </body>
</html>

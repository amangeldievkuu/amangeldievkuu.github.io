<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%TITLE% — %SITE_NAME%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:type" content="article" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Inter:opsz,wght@14..32,400..600&display=swap" />
    <script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
    <script type="module" src="/src/post.ts"></script>
  </head>
  <body class="post-page">
    <header class="top">
      <a class="mark" href="/" aria-label="%SITE_NAME%, home">%SITE_NAME%<span>.</span></a>
      <nav aria-label="Back"><a href="/#writing">← back to the shelf</a></nav>
    </header>

    <main class="post">
      <p class="post-meta"><time datetime="%DATE_ISO%">%DATE%</time> · %MINUTES% min read</p>
      <h1 class="post-title" style="view-transition-name: %VT_NAME%">%TITLE%</h1>
      <p class="post-desc">%DESCRIPTION%</p>
      <svg class="post-rule" viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true">
        <path pathLength="1" d="M2 14C80 12 120 15 190 13s70-9 82-2-8 12-14 4 18-12 40-8c60 6 150 2 290 6" />
      </svg>
      <article class="prose">%CONTENT%</article>
      <footer class="post-end">
        <svg viewBox="0 0 220 30" aria-hidden="true"><path pathLength="1" d="M2 20c40-2 70 2 110-1s52-14 60-4-10 12-12 4 30-6 50-4" /><circle cx="214" cy="15" r="3.5" /></svg>
        <p>fin. <a href="/#writing">back to the shelf</a></p>
      </footer>
    </main>
  </body>
</html>
